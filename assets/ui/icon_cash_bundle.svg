<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Note Base Gradients -->
    <linearGradient id="noteTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1de9b6"/>
      <stop offset="50%" stop-color="#00bfa5"/>
      <stop offset="100%" stop-color="#00796b"/>
    </linearGradient>
    <linearGradient id="noteMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfa5"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="noteBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897b"/>
      <stop offset="100%" stop-color="#00332c"/>
    </linearGradient>
    
    <!-- Gold / Tactical Strap Gradient -->
    <linearGradient id="goldStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Bottom Banknote 3 -->
  <g filter="url(#cashShadow)">
    <polygon points="6,34 46,20 58,26 18,40" fill="url(#noteBot)" stroke="#004d40" stroke-width="0.8"/>
  </g>

  <!-- Middle Banknote 2 -->
  <g filter="url(#cashShadow)">
    <polygon points="6,29 46,15 58,21 18,35" fill="url(#noteMid)" stroke="#00796b" stroke-width="0.8"/>
  </g>

  <!-- Top Main Banknote 1 -->
  <g filter="url(#cashShadow)">
    <polygon points="6,24 46,10 58,16 18,30" fill="url(#noteTop)" stroke="#80cbc4" stroke-width="1"/>
    
    <!-- Banknote Inner Guilloche Border -->
    <polygon points="9,24 44,12 54,17 19,29" fill="none" stroke="#e0f2f1" stroke-opacity="0.45" stroke-width="0.8"/>

    <!-- Subtle Geometric Corner Marks -->
    <circle cx="12" cy="23" r="1.5" fill="#e0f2f1" fill-opacity="0.7"/>
    <circle cx="51" cy="18" r="1.5" fill="#e0f2f1" fill-opacity="0.7"/>
  </g>

  <!-- Banknote Stack Side Thickness Edges -->
  <polygon points="6,24 18,30 18,43 6,37" fill="#004d40" stroke="#00332c" stroke-width="0.5"/>
  <polygon points="18,30 58,16 58,29 18,43" fill="#00332c" stroke="#002520" stroke-width="0.5"/>
  <!-- Stack Layers Lines -->
  <line x1="6" y1="28" x2="18" y2="34" stroke="#00796b" stroke-width="0.6"/>
  <line x1="6" y1="33" x2="18" y2="39" stroke="#00796b" stroke-width="0.6"/>
  <line x1="18" y1="34" x2="58" y2="20" stroke="#004d40" stroke-width="0.6"/>
  <line x1="18" y1="39" x2="58" y2="25" stroke="#004d40" stroke-width="0.6"/>

  <!-- Tactical Security Currency Strap (Binds the bundle) -->
  <polygon points="26,17 38,13 42,21 30,26" fill="url(#goldStrap)" stroke="#ff6f00" stroke-width="0.8" filter="url(#cashShadow)"/>
  <polygon points="30,26 42,21 42,35 30,39" fill="#ff8f00" stroke="#e65100" stroke-width="0.6"/>

  <!-- Central Sector Zero Emblem on the Strap -->
  <circle cx="36" cy="20" r="4.5" fill="#212121" stroke="#ffe082" stroke-width="1"/>
  <!-- Stylized Tactical "Z" / Crest inside emblem -->
  <path d="M34,18 L38,18 L34,22 L38,22" stroke="#ffb300" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Glowing Specular Glint on Top Corner -->
  <polygon points="14,22 17,21 16,23 13,24" fill="#ffffff" fill-opacity="0.6"/>
</svg>
